name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, unit tests and lint
        run: ./gradlew --stacktrace :domain:test :app:testDebugUnitTest :app:assembleDebug :app:lintDebug

      - name: Check the Room schema is committed
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            echo "::error::Room schema in app/schemas changed or is missing. Commit the generated JSON below."
            git status --porcelain app/schemas
            find app/schemas -name '*.json' -print -exec cat {} \;
            exit 1
          fi

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports
            domain/build/reports

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: scorenge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
