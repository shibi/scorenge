name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Firebase config and the shared debug key come from repo secrets, so they stay out of the
      # public repo. Without the secrets (forks, or before they're added) CI builds with a
      # placeholder config; that APK runs but Google sign-in won't work in it.
      - name: Provide Firebase config and debug key
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set; using the placeholder Firebase config."
            cp ci/google-services.placeholder.json app/google-services.json
          fi
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > app/debug.keystore
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret not set; the APK is signed with the runner's own debug key."
          fi

      - name: Build, unit tests and lint
        run: ./gradlew --stacktrace :domain:test :app:testDebugUnitTest :app:assembleDebug :app:lintDebug

      # Builds the shrunk (R8) release app, so a missing keep rule fails here rather than in the
      # Play Store build. Signed with the upload key when its secrets are set.
      - name: Release build
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_KEYSTORE_PASSWORD" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          else
            echo "::warning::Release key secrets not set; the release build is unsigned."
          fi
          ./gradlew --stacktrace :app:bundleRelease :app:assembleRelease

      - name: Check the Room schema is committed
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            echo "::error::Room schema in app/schemas changed or is missing. Commit the generated JSON below."
            git status --porcelain app/schemas
            find app/schemas -name '*.json' -print -exec cat {} \;
            exit 1
          fi

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports
            domain/build/reports

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: scorenge-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release bundle and APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: scorenge-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
